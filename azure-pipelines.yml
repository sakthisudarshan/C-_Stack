trigger:
  branches:
    include:
      - 9-Block-positive-Cases
      - 9-Block-positive-Cases-Parcel
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

stages:
  - stage: BuildAndValidate
    displayName: 'Build, Test, and White-Box Analysis'
    jobs:
      - job: BackendBuildAndTest
        displayName: 'Build .NET Web API & Run Coverlet Tests'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: $(DOTNET_VERSION)

          - script: dotnet restore NineBlock.sln
            displayName: 'Restore Solution NuGet Packages'

          - script: dotnet build NineBlock.sln --configuration $(buildConfiguration) --no-restore
            displayName: 'Build Solution (Release)'

          - script: dotnet test tests/NineBlock.Tests/NineBlock.Tests.csproj --configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"
            displayName: 'Run Unit Tests with Coverage'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/TestResults/*.trx'
            displayName: 'Publish Unit Test Results'

          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: '**/TestResults/**/coverage.cobertura.xml'
            displayName: 'Publish Code Coverage Results'

      - job: FrontendBuild
        displayName: 'Build React Parcel Application'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: |
              cd frontend
              npm install
            displayName: 'Install Frontend Dependencies'

          - script: |
              cd frontend
              npm run build
            displayName: 'Vite Production Build'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'frontend/dist'
              ArtifactName: 'frontend-drop'

      - job: MetricAnalysis
        displayName: 'White-Box Quality Gates Analysis'
        dependsOn:
          - BackendBuildAndTest
          - FrontendBuild
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: |
              mkdir -p reports
              npx jscpd backend/Services/ frontend/src/utils/ --threshold 0 --reporters console,json --output reports/duplication.json
            displayName: 'Scan Code Duplication (jscpd: 0% Expected)'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'reports'
              ArtifactName: 'metric-reports'
