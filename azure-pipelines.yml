trigger:
  branches:
    include:
      - 9-Block-Negative-Cases
      - 9-Block-Negative-Cases-Rollup
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

stages:
  - stage: BuildAndValidate
    displayName: 'Build, Lint & Extended Metric Analysis'
    jobs:
      - job: BackendBuild
        displayName: 'Build & Test .NET Core Web API'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: $(DOTNET_VERSION)

          - script: dotnet restore backend/NineBlock.csproj
            displayName: 'Restore NuGet Packages'
          - script: dotnet build backend/NineBlock.csproj --configuration $(buildConfiguration) --no-restore
            displayName: 'Build Backend Project'

          - script: dotnet test tests/NineBlock.Tests/NineBlock.Tests.csproj --configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" || exit 0
            displayName: 'Run Unit Tests with Coverage'

          - script: dotnet publish backend/NineBlock.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/backend-publish
            displayName: 'Publish Backend Artifact'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend-publish'
              ArtifactName: 'backend-drop'

      - job: FrontendBuild
        displayName: 'Build React Application with Webpack'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: |
              cd frontend
              npm install --legacy-peer-deps
            displayName: 'Install NPM Dependencies'

          - script: |
              cd frontend
              npm run build
            displayName: 'Run Webpack Production Build'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'frontend/dist'
              ArtifactName: 'frontend-drop'

      - job: ExtendedMetricAnalysis
        displayName: 'White-Box Quality Gates Analysis'
        dependsOn:
          - BackendBuild
          - FrontendBuild
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: |
              mkdir -p reports
              npx jscpd backend/Services/ --reporters console,json --output reports/backend-duplication.json || true
              npx jscpd frontend/src/components/ --reporters console,json --output reports/frontend-duplication.json || true
            displayName: 'Scan Duplication Clones (jscpd)'

          - script: |
              npx --yes lizard backend/Services/ -l csharp --CCN 15 || true
            displayName: 'Scan Cyclomatic Complexity (Lizard)'

          - script: |
              dotnet list backend/NineBlock.csproj package --vulnerable || true
            displayName: 'Scan Dependency Vulnerabilities (SCA)'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'reports'
              ArtifactName: 'metric-reports'
