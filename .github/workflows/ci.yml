name: 9-Block CI/CD Pipeline (Negative Fixtures)

on:
  push:
    branches:
      - 9-Block-Negative-Cases
      - 9-Block-Negative-Cases-Rollup
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build-test:
    name: Backend CI (.NET 8.0 LTS + Coverage)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/NineBlock.csproj

      - name: Build Backend (Release)
        run: dotnet build backend/NineBlock.csproj --configuration Release --no-restore

      - name: Run Test Suite with Coverage
        run: dotnet test tests/NineBlock.Tests/NineBlock.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" || true

  frontend-build:
    name: Frontend CI (React + Webpack)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Compile Webpack Production Bundle
        working-directory: frontend
        run: npm run build

  white-box-metrics:
    name: Extended White-Box Metrics (Duplication, Complexity, Lint, SAST, SCA)
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (for Lizard Complexity)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lizard Code Complexity Analyzer
        run: pip install lizard

      - name: 1. Code Duplication Scan (jscpd: Triggers Clones)
        run: |
          mkdir -p reports
          npx jscpd backend/Services/ --reporters console,json --output reports/backend-duplication.json || true
          npx jscpd frontend/src/components/ --reporters console,json --output reports/frontend-duplication.json || true

      - name: 2. Cyclomatic & Cognitive Complexity Scan (Lizard)
        run: |
          lizard backend/Services/ -l csharp --CCN 15 -o reports/complexity.html || true

      - name: 3. Static Security Analysis (Semgrep SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/csharp
            p/sql
        continue-on-error: true

      - name: 4. Dependency SCA Audit (dotnet vulnerable + npm audit)
        run: |
          dotnet list backend/NineBlock.csproj package --vulnerable || true
          cd frontend && npm audit || true

      - name: Upload White-Box Metric Reports
        uses: actions/upload-artifact@v4
        with:
          name: white-box-reports
          path: reports/
